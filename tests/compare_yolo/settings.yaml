# วิธีแก้ไฟล์นี้
# - ข้อความหลังเครื่องหมาย # เป็นคำอธิบาย ไม่มีผลต่อการรัน
# - พาธแบบสัมพัทธ์เริ่มจากโฟลเดอร์หลัก VIPER เสมอ หรือระบุพาธเต็มก็ได้
# - รักษาการเยื้องด้วยช่องว่างตามเดิม ห้ามใช้ Tab
# - null หมายถึงไม่ระบุค่า ส่วน true / false หมายถึงเปิด / ปิด
# - แต่ละส่วนตั้งค่าแยกกัน เช่น confidence ของ Detect ไม่เปลี่ยน Grad-CAM

# ไฟล์ data.yaml ที่ Dataset Builder ใน VIPER สร้างไว้
# ใช้ dataset ชุดเดียวกับ VIPER เพื่อรักษาภาพ label และ train/validation split เดิม
# หากสร้าง dataset ใหม่ ให้เปลี่ยนพาธนี้เป็น data.yaml ของชุดใหม่
dataset_yaml: outputs/detection/datasets/dataset_c48f2aa2/data.yaml

# โมเดลตั้งต้นก่อนเทรน ตัวทดสอบจะเทรนใหม่เอง แล้วใช้ best.pt ที่ได้ในขั้นถัดไป
# เปลี่ยนเป็นไฟล์ .pt ที่มีอยู่ใน VIPER/models/ เช่น models/yolov8s.pt
# ตัวเลือก: shapes-best.pt, yolo11n.pt, yolo11s.pt, yolo12n.pt,
# yolo12s.pt, yolov8n.pt, yolov8s.pt
base_model: models/yolo11n.pt

# ภาพที่ใช้ทดสอบหลังเทรนเสร็จ ทั้ง Detect และ Grad-CAM ใช้รายการนี้ร่วมกัน
# ใช้ไฟล์เดียวกับ Image Input ใน VIPER เพิ่มหลายภาพได้โดยเพิ่มบรรทัด - พาธภาพ
# รายการนี้ไม่เพิ่มภาพเข้า dataset สำหรับเทรน
test_images:
  - outputs/samples/shapes-yolo/multi_003.jpg

# โฟลเดอร์เก็บผลทดลอง ต้องเป็นโฟลเดอร์ย่อยภายใน tests/compare_yolo/
# แต่ละครั้งจะสร้าง run_วันเวลา_รหัส ภายในนี้ เก็บโมเดลและภาพผลลัพธ์ของรันนั้น
output_dir: tests/compare_yolo/outputs

train:
  # จำนวนรอบที่ฝึกด้วยชุด train เช่น 10 เปลี่ยนเป็น 50 เพื่อเทรน 50 epochs
  epochs: 10

  # ขนาดภาพที่ YOLO ใช้ระหว่างเทรน หน่วยพิกเซล แนะนำค่าหาร 32 ลงตัว เช่น 640
  # ขนาดใหญ่ขึ้นใช้หน่วยความจำและเวลามากขึ้น โดยไม่แก้ขนาดไฟล์ภาพต้นฉบับ
  image_size: 640

  # จำนวนภาพต่อ batch ที่ส่งเข้าโมเดลพร้อมกัน เช่น 4 หรือ 8
  # หากหน่วยความจำไม่พอ ให้ลดเป็น 2 หรือ 1
  batch: 4

  # อุปกรณ์เทรน: null = ให้ Ultralytics เลือก, cpu = CPU,
  # mps = GPU ของ Apple ที่รองรับ, "0" = NVIDIA GPU หมายเลข 0 ที่มี CUDA
  device: null

  # ค่าเริ่มต้นของการสุ่มในการเทรน เช่น การสุ่มลำดับและ augmentation
  # ใช้ค่าเดิมเพื่อช่วยให้รันทดลองซ้ำได้ใกล้เคียงกัน 0 คือค่าเริ่มต้นของ Ultralytics
  # ไม่ได้แบ่ง dataset ใหม่ เพราะใช้ split ที่สร้างจาก VIPER อยู่แล้ว
  seed: 0

  # true = ขอให้ PyTorch ใช้การคำนวณแบบทำซ้ำได้เมื่อรองรับ
  # ช่วยลดความต่างจากการสุ่ม แต่ไม่รับประกันผลเหมือนกันทุกเครื่องหรือทุกเวอร์ชัน
  deterministic: true

  # จำนวน worker สำหรับอ่านข้อมูล 0 = อ่านในโปรเซสหลัก
  # เพิ่มได้เมื่อการอ่านภาพเป็นคอขวด แต่จะใช้ทรัพยากรเพิ่ม
  workers: 0

detect:
  # คะแนนขั้นต่ำของวัตถุที่จะเก็บไว้ 0.25 = 25% ช่วงที่กำหนดได้คือ 0 ถึง 1
  # เพิ่มค่าเพื่อคัดเฉพาะผลที่มีคะแนนสูงขึ้น ลดค่าเพื่อเก็บผลเพิ่ม
  confidence: 0.25

  # เกณฑ์ IoU ของ NMS สำหรับตัดกล่องซ้ำระหว่างตรวจจับ ช่วง 0 ถึง 1
  # ค่าต่ำตัดกล่องที่ทับกันได้มากขึ้น ค่าสูงยอมให้กล่องทับกันได้มากขึ้น
  # ค่านี้ไม่ใช่เกณฑ์จับคู่กล่องเพื่อคำนวณ Evaluation
  iou: 0.7

  # ขนาดภาพที่ YOLO ใช้ตอน Detect ตั้งแยกจากขนาดภาพตอนเทรนได้
  # หากต้องการเทียบกับ VIPER ให้ใช้ค่า Image size ของโหนด Detect เดียวกัน
  image_size: 640

  # คลาสที่จะให้ Detect แสดง เช่น [2] = คลาสหมายเลข 2, [0, 2] = สองคลาส
  # null หรือ [] = ทุกคลาส หมายเลขคลาสดูจาก names ใน data.yaml
  # dataset Shapes ตัวอย่าง: 0 = circle, 1 = triangle, 2 = square
  class_ids: [2]

  # อุปกรณ์สำหรับ Detect: null, cpu, mps หรือ "0" เช่นเดียวกับส่วน train
  device: null

gradcam:
  # วิธีที่ต้องการสร้างภาพ เลือกครบทั้ง 4 วิธีหรือเหลือวิธีเดียวก็ได้
  # ตัวอย่างรันเฉพาะ GradCAM: methods: [GradCAM]
  # แต่ละวิธีสร้างภาพ overlay และ heatmap แยกโฟลเดอร์กัน
  methods: [GradCAM, GradCAMPlusPlus, EigenCAM, LayerCAM]

  # คะแนนขั้นต่ำของ response ที่ใช้เลือกเป้าหมาย CAM และกล่องที่วาดบน overlay
  # ตั้งแยกจาก Detect เพื่อเทียบกับ Confidence ของโหนด Grad-CAM ใน VIPER
  # หากไม่มี response ผ่านเงื่อนไข ตัว CAM ใช้ raw response สูงสุดสำรองเหมือน VIPER
  confidence: 0.2

  # Layer ของโมเดลที่นำ feature มาสร้าง CAM
  # null หรือ [] = เลือก feature layer สุดท้ายก่อน Detect อัตโนมัติ
  # ระบุเองได้ เช่น [13, 16, 19] แต่หมายเลขที่เหมาะสมขึ้นกับโมเดลที่เลือก
  # ใช้ layer ที่ให้ feature tensor ไม่ใช่หัว Detect
  target_layers: null

  # คลาสเป้าหมายและกล่องที่จะวาดบน overlay: null หรือ [] = ทุกคลาส
  # เช่น [2] หรือ [0, 2] ตั้งแยกจาก class_ids ใน Detect
  # EigenCAM อธิบาย feature โดยรวม ไม่ได้ใช้ class target ในการคำนวณ heatmap
  # จึงอาจได้ heatmap เดิมแม้เปลี่ยน class_ids แต่กล่องที่แสดงยังถูกกรอง
  class_ids: null

  # null = ใช้ CUDA ถ้ามี มิฉะนั้น CPU ตามพฤติกรรม Grad-CAM ของ VIPER
  # ระบุ cpu, mps หรือ "0" เองได้ โดยขึ้นกับอุปกรณ์ที่เครื่องรองรับ
  device: null

  # ขนาดภาพที่ย่อ/ขยายและเติมขอบก่อนคำนวณ CAM ไม่แก้ไฟล์ต้นฉบับ
  # ค่า 640 สอดคล้องกับค่าภายในของ Grad-CAM ใน VIPER
  image_size: 640

  # IoU ของ NMS สำหรับกล่องบน overlay ของ CAM ตั้งแยกจาก Detect
  # 0.8 สอดคล้องกับค่าภายในของ Grad-CAM ใน VIPER
  iou: 0.8

  # สัดส่วน raw predictions ที่เรียงคะแนนแล้วนำมาพิจารณาเป็นเป้าหมาย CAM
  # 0.1 = พิจารณา 10% แรก ก่อนกรอง confidence และคลาส ไม่ใช่คะแนนความแม่นยำ
  # ต้องมากกว่า 0 และไม่เกิน 1 ค่า 0.1 สอดคล้องกับ VIPER
  ratio: 0.1

  # ค่าเป้าหมายที่จะใช้คำนวณ gradient:
  # class = คะแนนคลาส, box = ค่าพิกัดกล่อง, all = ใช้ทั้งสองอย่าง
  # ใช้ class เพื่อให้ตรงกับ VIPER ค่านี้ไม่มีผลต่อวิธี EigenCAM
  target_output_type: class

  # true = วาดกรอบ ชื่อคลาส และ confidence บนภาพ overlay
  # false = แสดง overlay โดยไม่วาดกรอบ ส่วนภาพ heatmap ไม่ได้รับผลจากค่านี้
  show_boxes: true

  # seed สำหรับสุ่มสีกรอบคลาส ใช้เลขเดิมจะได้สีชุดเดิม
  # มีผลต่อสีกรอบเท่านั้น ไม่เปลี่ยนการเทรน การตรวจจับ หรือ heatmap
  color_seed: 7
